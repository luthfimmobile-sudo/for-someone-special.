<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Pesan Buat Kamu ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #ffe5ec;
            position: relative;
        }

        /* --- 📸 BACKGROUND FOTO DARI IMGBB LU --- */
        .photo-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('https://ibb.co'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: none; 
        }

        /* Lapisan gelap transparan di atas foto agar teks surat gampang dibaca */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55); 
            z-index: 0;
            display: none; 
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            z-index: 10;
        }

        /* --- 1. TAMPILAN AMPLOP --- */
        .envelope-wrapper {
            cursor: pointer;
            transition: transform 0.3s ease;
            display: block;
            position: relative;
            z-index: 20; 
        }
        .envelope-wrapper:hover {
            transform: scale(1.05);
        }
        .envelope {
            font-size: 100px;
            animation: float 3s ease-in-out infinite;
        }
        .click-me {
            font-size: 16px;
            color: #ff4d6d;
            font-weight: bold;
            margin-top: 15px;
            animation: pulse 1.5s infinite;
        }

        /* --- 2. POPUP PASSWORD --- */
        .popup-pw {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 2px solid #ffb3c6;
            position: relative;
            z-index: 30;
        }
        .popup-pw h3 {
            margin-top: 0;
            color: #ff4d6d;
        }
        .popup-pw input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #ffe5ec;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            outline: none;
        }
        .popup-pw input:focus {
            border-color: #ff4d6d;
        }
        .popup-pw button {
            padding: 10px 25px;
            background: #ff4d6d;
            color: white;
            border: none;
            border-radius: 200px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- 3. TAMPILAN SURAT --- */
        .letter-card {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid #ffb3c6;
            text-align: left;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease;
            position: relative;
            z-index: 30;
        }
        .letter-card.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .letter-title {
            font-size: 22px;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px dashed #ffe5ec;
            padding-bottom: 10px;
        }
        .letter-text {
            font-size: 16px;
            color: #2b2b2b;
            line-height: 1.6;
            min-height: 150px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Container Background Foto Lu & Overlay Kegelapan Teks -->
    <div class="photo-background" id="photoBgContainer"></div>
    <div class="overlay" id="videoOverlay"></div>

    <div class="container">
        <!-- Bagian Amplop -->
        <div class="envelope-wrapper" id="envelopeSection" onclick="showPasswordPopup()">
            <div class="envelope">💌</div>
            <div class="click-me">Klik amplop ini untuk buka pesan...</div>
        </div>

        <!-- Bagian Popup Password -->
        <div class="popup-pw" id="passwordSection">
            <h3>Tebak Dulu Clue-nya! 😜</h3>
            <p id="clueText">apa panggilan sayang kita</p>
            <input type="text" id="passwordInput" placeholder="Masukkan jawaban...">
            <br>
            <button onclick="checkPassword()">Buka Surat ✨</button>
        </div>

        <!-- Bagian Surat Cinta -->
        <div class="letter-card" id="letterSection">
            <div class="letter-title">Hai seng... ❤️</div>
            <div class="letter-text" id="typingTarget"></div>
        </div>
    </div>

    <!-- 🎵 MP3 RESMI (Raim Laode - Menari-nari) -->
    <audio id="bgMusic" src="https://catbox.moe" loop></audio>

    <script>
        const passwordBenar = "seng"; 
        const cluePertanyaan = "apa panggilan sayang kita"; 
        
        const pesanCinta = "Hai seng jujur aja aku masih belom siap buat lupain kamu kata orang sih buat move-on butuh waktu , mungkin iya butuh waktu dan aku gatau kapan waktunya. \n\nAku minta maaf ya kalo semisalnya aku masih belom bisa lupain kamu dan move-on dari kamu padahal kamu lagi persiapan buat ke jenjang yang lebih serius sama dia. \n\nAku salah ga sih kalo bilang aku kangen banget sama kamu? dan ya aku kangen sama kamu tapi disatu sisi aku juga gamau sampe ngeganggu kamu yang ngebuat hancur persiapan kalian berdua. \n\nAku harus apa ya? kamu ada saran kah? aku kangen kita video call lagi walaupun ga ngobrol. sekarang waktu yang biasanya kita pakai buat Videocall aku isi dengan kegabutan setiap hari kayak gitu hehe. \n\ntolong bantu kasih jawabannya ya buat aku apapun jawaban dari kamu pasti aku terima.";

        document.getElementById('clueText').innerText = cluePertanyaan;

        function showPasswordPopup() {
            document.getElementById('envelopeSection').style.display = 'none';
            document.getElementById('passwordSection').style.display = 'block';
        }

        function checkPassword() {
            const inputUser = document.getElementById('passwordInput').value.trim().toLowerCase();
            const music = document.getElementById('bgMusic');

            if (inputUser === passwordBenar.toLowerCase()) {
                document.getElementById('passwordSection').style.display = 'none';
                
                // Munculkan foto kalian berdua dari ImgBB
                document.getElementById('photoBgContainer').style.display = 'block';
                document.getElementById('videoOverlay').style.display = 'block';
                
                // MAINKAN LAGU (Lagu Raim Laode langsung bunyi otomatis)
                music.play().catch(error => console.log("Musik diblokir browser: ", error));

                const letter = document.getElementById('letterSection');
                letter.style.display = 'block';
                setTimeout(() => {
                    letter.classList.add('show');
                    typeWriter();
                }, 100);
            } else {
                alert("Yeee salah! Masa panggilan sayang sendiri lupa? Coba lagi.. 😜❤️");
            }
        }

        let index = 0;
        function typeWriter() {
            if (index < pesanCinta.length) {
                let char = pesanCinta.charAt(index);
                if (char === "\n") {
                    document.getElementById("typingTarget").innerHTML += "<br>";
                } else {
                    document.getElementById("typingTarget").innerHTML += char;
                }
                index++;
                setTimeout(typeWriter, 55);
            }
        }
    </script>
</body>
</html>
