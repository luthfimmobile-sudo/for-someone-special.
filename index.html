<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Surat Buat Kamu ❤️</title>
    <!-- Memanggil font Quicksand agar tampilan tulisan santai, manis, dan lembut -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #070506 0%, #140b0e 50%, #220c11 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        /* Mengunci posisi efek hujan hati agar selalu berada di latar paling belakang */
        .falling-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.45);
            font-size: 14px;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
        .card {
            background: rgba(18, 12, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.15), 
                        inset 0 0 20px rgba(255, 182, 193, 0.02);
            text-align: center;
            max-width: 350px;
            width: 85%;
            border: 1px solid rgba(255, 77, 109, 0.3);
            box-sizing: border-box;
            max-height: 80vh;
            overflow-y: auto;
            color: #f7e6e9;
            z-index: 999;
            position: relative;
        }
        .card::-webkit-scrollbar { width: 4px; }
        .card::-webkit-scrollbar-thumb { background: rgba(255, 77, 109, 0.3); border-radius: 10px; }
        
        h1 { color: #ff4d6d; font-size: 24px; margin-top: 0; margin-bottom: 20px; font-weight: 700; text-shadow: 0 0 12px rgba(255, 77, 109, 0.4); }
        
        .typewriter-container {
            text-align: justify;
            margin-bottom: 15px;
        }
        .typewriter-p { 
            color: #e2d2d5; 
            line-height: 1.7; 
            font-size: 14.5px; 
            font-weight: 400; 
            margin: 0 0 18px 0;
            display: block;
        }

        .text-center { text-align: center; }
        .iloveyou { 
            color: #ff4d6d; 
            font-weight: 700; 
            text-align: center; 
            font-size: 16px; 
            margin-top: 25px; 
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
            display: block;
        }
        input {
            width: 85%;
            padding: 14px;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 77, 109, 0.35);
            border-radius: 25px;
            text-align: center;
            outline: none;
            font-size: 15px;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus {
            border-color: #ff4d6d;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
            background: rgba(255, 255, 255, 0.06);
        }
        button {
            background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 15px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            margin: 15px 10px 0 10px;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
        }
        button:active {
            transform: scale(0.95);
        }
        .hidden { display: none !important; }
        .heart-icon { 
            color: #ff4d6d; 
            font-size: 45px; 
            margin-bottom: 15px; 
            animation: float 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .error-text { color: #ff4d6d; font-size: 13px; font-weight: 700; margin-top: -5px; text-align: center; }
    </style>
</head>
<body>

    <!-- Menggunakan link audio cadangan eksternal terpadu -->
    <audio id="bgMusic" loop preload="auto" crossorigin="anonymous">
        <source src="https://archive.org" type="audio/mpeg">
        <source src="menari-nari.mp3" type="audio/mpeg">
    </audio>

    <!-- Halaman 1: Fitur Password -->
    <div id="halaman1" class="card">
        <div class="heart-icon">🔒</div>
        <h1>Eitss, Jawab Dulu! ✨</h1>
        <p class="text-center" style="color: #cbd5e1;">Pertanyaan: Apa panggilan kesayangan kita?</p>
        <input type="text" id="passwordInput" placeholder="Ketik jawabannya di sini...">
        <p id="pesanSalah" class="error-text hidden">Hayo... panggilannya salah! Inget-inget lagi 😜</p>
        <button onclick="cekPassword()">Masuk 💌</button>
    </div>

    <!-- Halaman 2: Isi Surat Pertama (Curhatan Kangen) -->
    <div id="halaman2" class="card hidden">
        <h1>Dear Senggg 🌹</h1>
        <div class="typewriter-container">
            <p class="typewriter-p" id="p1"></p>
            <p class="typewriter-p" id="p2"></p>
            <p class="typewriter-p" id="p3"></p>
            <p class="typewriter-p" id="p4"></p>
        </div>
        <div class="text-center hidden" id="btnContainer1">
            <button onclick="keHalamanTiga()">Lanjut ➡️</button>
        </div>
    </div>

    <!-- Halaman 3: Kalimat Penutup Akhir -->
    <div id="halaman3" class="card hidden">
        <div class="heart-icon">💝</div>
        <h1>Isi Hatiku.. ✨</h1>
        <div class="typewriter-container">
            <p class="typewriter-p" id="p5"></p>
            <p class="typewriter-p" id="p6"></p>
            <p class="typewriter-p iloveyou" id="p7"></p>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        const texts = {
            p1: "🌸 Hai senggg gimana kabar kamu? baik-baik aja kan? gaada yang gangguin ketenangan kamu? kalo iya Alhamdulillah aku ikut seneng dengernya.",
            p2: "✨ Maaf ya aku sampein nya disini karna aku gaenak mau chat kamu takut ngeganggu planning kamu atau apalah nantinya.",
            p3: "🌸 Aku cuma mau bilang aku kangen sama kamu , aku kangen denger suara kamu , aku kangen videocallan sama kamu dan aku kangen semuanya tentang kamu.",
            p4: "✨ Menurut kamu salah ga sih yang aku rasain? kalo ga salah aku harus apa? aku udah gapunya akses lagi buat bisa tatapan muka sama kamu.",
            p5: "🌹 Makasih ya udah baca isi hati aku dan aku minta maaf kalo aku kasih mengganggu kamu. Aku tarik kembali ucapan ku kemarin yang mau jaga jarak sama kamu kayaknya aku kalah sama ego ku sendiri dan masih berharap bisa berinteraksi sama kamu dan jadi sosok aku yang biasanya buat kamu ya at least sampe hari terbaiknya kamu.",
            p6: "✨ Kalo menurut kamu aku masih bisa buat interaksi sama kamu tolong vc aku ya.",
            p7: "ILOVEYOU SO MUCH WANITA TERBAIK KU. 💖"
        };

        function cekPassword() {
            const input = document.getElementById('passwordInput').value.trim().toLowerCase();
            const music = document.getElementById('bgMusic');
            
            if (input === 'seng') {
                if (!audioCtx) { audioCtx = new AudioContext(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }

                music.play().then(() => { console.log("Musik sukses!"); }).catch(error => {
                    music.muted = false;
                    music.play();
                });
                
                document.getElementById('halaman1').classList.add('hidden');
                document.getElementById('halaman2').classList.remove('hidden');
                
                mulaiHujanHati();
                
                mulaiKetikBerdasarUrutan(['p1', 'p2', 'p3', 'p4'], 0, () => {
                    document.getElementById('btnContainer1').classList.remove('hidden');
                    const card = document.getElementById('halaman2');
                    card.scrollTo({ top: card.scrollHeight, behavior: 'smooth' });
                });
            } else {
                document.getElementById('pesanSalah').classList.remove('hidden');
            }
        }

        function keHalamanTiga() {
            document.getElementById('halaman2').classList.add('hidden');
            document.getElementById('halaman3').classList.remove('hidden');
            mulaiKetikBerdasarUrutan(['p5', 'p6', 'p7'], 0, () => {});
        }

        function ketikPerHuruf(elementId, text, speed, onComplete) {
            let i = 0;
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            const card = element.closest('.card');
            
            function mengetik() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    if (card) {
                        card.scrollTo({ top: card.scrollHeight, behavior: 'auto' });
                    }
setTimeout(mengetik, speed);} else if (onComplete) {onComplete();}}mengetik();}function mulaiKetikBerdasarUrutan(ids, index, finalCallback) {if (index < ids.length) {const currentId = ids[index];ketikPerHuruf(currentId, texts[currentId], 45, () => {setTimeout(() => {mulaiKetikBerdasarUrutan(ids, index + 1, finalCallback);}, 500);});} else if (finalCallback) {finalCallback();}}function mulaiHujanHati() {setInterval(() => {const heart = document.createElement('div');heart.classList.add('falling-heart');heart.innerHTML = '❤️';heart.style.left = Math.random() * 100 + 'vw';heart.style.animationDuration = Math.random() * 3 + 3 + 's';heart.style.fontSize = Math.random() * 12 + 10 + 'px';document.body.appendChild(heart);setTimeout(() => {heart.remove();}, 6000);}, 500);}
