<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Pesan Buat Kamu ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #ffe5ec;
        }

        /* --- BACKGROUND VIDEO SHORTS FULLSCREEN --- */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            display: none;
        }
        .video-background iframe {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.3);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            z-index: 0;
            display: none;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            z-index: 10;
        }

        /* --- 1. TAMPILAN AMPLOP --- */
        .envelope-wrapper {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .envelope-wrapper:hover {
            transform: scale(1.05);
        }
        .envelope {
            font-size: 100px;
            animation: float 3s ease-in-out infinite;
        }
        .click-me {
            font-size: 16px;
            color: #ff4d6d;
            font-weight: bold;
            margin-top: 15px;
            animation: pulse 1.5s infinite;
        }

        /* --- 2. POPUP PASSWORD --- */
        .popup-pw {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 2px solid #ffb3c6;
        }
        .popup-pw h3 {
            margin-top: 0;
            color: #ff4d6d;
        }
        .popup-pw input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #ffe5ec;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            outline: none;
        }
        .popup-pw input:focus {
            border-color: #ff4d6d;
        }
        .popup-pw button {
            padding: 10px 25px;
            background: #ff4d6d;
            color: white;
            border: none;
            border-radius: 200px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- 3. TAMPILAN SURAT --- */
        .letter-card {
            display: none;
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid #ffb3c6;
            text-align: left;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease;
        }
        .letter-card.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .letter-title {
            font-size: 22px;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px dashed #ffe5ec;
            padding-bottom: 10px;
        }
        .letter-text {
            font-size: 16px;
            color: #2b2b2b;
            line-height: 1.6;
            min-height: 150px;
        }
        
        .btn-reply {
            display: none;
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background-color: #ff4d6d;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
            text-align: center;
            text-decoration: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Video Background Container -->

    </div>
    <div class="overlay" id="videoOverlay"></div>

    <div class="container">

        <div class="envelope-wrapper" id="envelopeSection" onclick="showPasswordPopup()">
            <div class="envelope">💌</div>
            <div class="click-me">Klik amplop ini untuk buka pesan...</div>

        <!-- Bagian Popup Password -->
        <div class="popup-pw" id="passwordSection">
            <h3>Tebak Dulu Clue-nya! 😜</h3>

            <input type="text" id="passwordInput" placeholder="Masukkan jawaban...">
            <br>
            <button onclick="checkPassword()">Buka Surat ✨</button>
        </div>

        <!-- Bagian Surat Cinta -->
        <div class="letter-card" id="letterSection">
            <div class="letter-title">Hai seng... ❤️</div>

            <button class="btn-reply" id="replyBtn" onclick="sendResponse()">Beri Jawaban Lewat WA 💬</button>
